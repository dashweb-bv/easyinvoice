name: build

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  HUSKY: 0

jobs:
  check:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up the minimum supported Node.js version
        uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
      - name: Remember the minimum Node.js executable
        run: node -p '"MINIMUM_NODE=" + process.execPath' >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: pnpm/setup@v2
        with:
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            pnpm run lint:commits --last --verbose
          else
            pnpm run lint:commits --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
          fi
      - name: Check pull request title for squash merges
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm run lint:commits
      - run: pnpm run check
      - name: Check the package on the minimum supported Node.js version
        run: pnpm run test:package "$MINIMUM_NODE"
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Check PDF rendering in Chromium
        run: pnpm run test:browser
      - name: Upload coverage to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: pnpm/setup@v2
        with:
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Initialize the existing release history
        # npm records this commit as the published 3.0.47 release; the old workflow created no tags.
        run: |
          if ! git show-ref --verify --quiet refs/tags/v3.0.47; then
            git tag v3.0.47 f027ba710a08f2288eaa8f76bb60b060a45e9ac3
            git push origin refs/tags/v3.0.47
          fi
      - name: Version and publish
        run: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.npm_token }}
